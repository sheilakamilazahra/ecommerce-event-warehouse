
version: 2

models:
  - name: dim_customers
    description: "Dimensi pelanggan."
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_product_categories
    description: "Dimensi kategori produk."
    columns:
      - name: product_category
        data_tests:
          - unique
          - not_null

  - name: dim_payment_methods
    description: "Dimensi metode pembayaran."
    columns:
      - name: payment_method
        data_tests:
          - unique
          - not_null

  - name: fact_orders
    description: "Fakta transaksi pada grain satu baris per order."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: product_category
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product_categories')
                field: product_category

      - name: payment_method
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payment_methods')
                field: payment_method

  - name: daily_sales_mart
    description: "Agregasi penjualan harian."
    columns:
      - name: order_date
        data_tests:
          - unique
          - not_null
